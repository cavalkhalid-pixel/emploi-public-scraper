name: Scraper Conseil du Gouvernement (CG)

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: scraper-cg
  cancel-in-progress: false

jobs:
  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Plus de Chrome / Selenium : 2 dépendances suffisent
      - name: Dépendances
        run: pip install requests beautifulsoup4

      - name: Tests des parseurs
        run: python test_cg.py

      - name: Exécution du scraper CG
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scraper_cg.py

      - name: Commit des données
        if: always()
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data_cg/
          git diff --cached --quiet || git commit -m "Mise à jour des données CG - $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main || true
          git push origin main || true
